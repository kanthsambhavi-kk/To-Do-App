<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do App</title>


<link rel="stylesheet" href="style.css">


</head>

<body>
<div class="decorations">
    <span>✦</span>
    <span>♡</span>
    <span>✿</span>
    <span>✧</span>
    <span>☁</span>
    <span>♡</span>
    <span>✦</span>
</div>

<div class="container">

   <h1>My Tasks</h1>

<p class="quote">
    Let's complete today's tasks and make today count! ✨
</p>

    <div class="input-section">
        <input 
            type="text" 
            id="taskInput" 
            placeholder="Enter a task..."
        >

        <button id="addButton">Add</button>
    </div>
<div id="message"></div>
    <ul id="taskList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
